[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "failsafe"
version = "2.2.0"
description = "State-contrast dynamic analysis for attributing Passkey authentication blocks (thesis reproduction package)"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "pandas>=1.5", "cryptography>=41.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
collect = ["requests>=2.28"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
